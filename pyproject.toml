[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-tctn"
version = "1.0.0"
description = "Transductive text classification through term networks (TCTN) with genetic-algorithm hyper-parameter tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Felipe Provezano Coutinho" }]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-learn>=1.1"]

[project.scripts]
ga-tctn = "ga_tctn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
